name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Runs the API server in-process against in-memory storage, so no
      # database is needed here.
      - run: npm test

      - run: npx tsc -b

      - run: npm run lint

      - run: npm run build
